# Pre-commit hooks for spimple
#
# NOTE: When hooks modify files, pre-commit "fails" and aborts the commit.
# That is expected -- review the changes, then `git add -u && git commit` again.

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.fits$|\.npy$|\.npz$|\.dat$'
      - id: end-of-file-fixer
        exclude: '\.fits$|\.npy$|\.npz$|\.dat$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: mixed-line-ending
