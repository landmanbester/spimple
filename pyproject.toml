[project]
name = "spimple"
version = "0.0.6"
description = "Radio astronomy image post-processing tools"
readme = "README.md"
requires-python = ">=3.10, <3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Landman Bester", email = "lbester@sarao.ac.za" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "hip-cargo>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/landmanbester/spimple"
Repository = "https://github.com/landmanbester/spimple"
"Bug Tracker" = "https://github.com/landmanbester/spimple/issues"

# Lightweight install (default): pip install spimple
#     Pulls hip-cargo only. Enough to invoke any command -- the CLI wrappers
#     fall back to the container image when the native imports fail.
# Full install:                   pip install spimple[full]
#     Adds the scientific stack that core/ needs to execute natively.
[project.optional-dependencies]
full = [
    "astropy",
    "codex-africanus[complete]",
    "dask-ms[xarray]>=0.2.22",
    "ducc0",
    "katbeam",
    "numpy",
    "ray[default]",
    "reproject",
    "scipy",
    "xarray",
]

[project.scripts]
spimple = "spimple.cli:app"

[build-system]
requires = ["uv_build>=0.8.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"
# "*.md": ruff 0.16+ formats Python code blocks embedded in Markdown; our
# README/wiki snippets are illustrative signature fragments that ruff would
# rewrite into standalone-valid but misleading code.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# domain names: l/m coords, Stokes I0/Ix, Gaussian2D, emaj/emin
ignore = ["E741", "N802", "N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["spimple"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--durations=10",
]
markers = [
    "slow: Tests that take more time to run",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.2",
    "tbump>=6.11.0",
    "pre-commit>=4.0.0",
    "mypy>=1.0.0",
    "ipdb",
    "stimela>=2",
]
