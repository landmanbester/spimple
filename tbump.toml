[version]
current = "0.0.6"

regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (?:
    (?P<channel>a|b|rc)
    (?P<release>\d+)
  )?
  (?:
    \.post
    (?P<post>\d+)
  )?
  '''

[[field]]
name = "channel"
default = ""

[[field]]
name = "release"
default = ""

[[field]]
name = "post"
default = ""

[git]
message_template = "chore(release): bump version to {new_version}"
tag_template = "v{new_version}"

[[before_commit]]
name = "Generate changelog"
cmd = "uvx git-cliff --tag v{new_version} -o CHANGELOG.md"

[[before_commit]]
name = "Stage changelog"
cmd = "git add CHANGELOG.md"

[[before_commit]]
name = "Update container image tag to release version"
cmd = "python -c \"import re; p = 'src/spimple/_container_image.py'; t = open(p).read(); t = re.sub(r'(CONTAINER_IMAGE\\s*=\\s*\\\".*:)[^\\\"]+', r'\\g<1>{new_version}', t); open(p, 'w').write(t)\""

[[before_commit]]
name = "Regenerate cab definitions with release version"
cmd = "hip-cargo generate-cabs --module 'src/spimple/cli/*.py' --output-dir src/spimple/cabs"

[[before_commit]]
name = "Stage updated cab definitions"
cmd = "git add src/spimple/cabs/*.yml"

[[before_commit]]
name = "Stage _container_image.py with updated container image tag"
cmd = "git add src/spimple/_container_image.py"

[[before_commit]]
name = "Update uv.lock"
cmd = "uv lock"

[[before_commit]]
name = "Stage uv.lock"
cmd = "git add uv.lock"

[[file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[file]]
src = "src/spimple/__init__.py"
search = '__version__ = "{current_version}"'

[[after_push]]
name = "create github release"
cmd = "gh release create v{new_version} --generate-notes"
