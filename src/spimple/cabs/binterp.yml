cabs:
  binterp:
    flavour: python
    command: spimple.core.binterp.binterp
    name: binterp
    info:
      Interpolate and create power beam.
    policies:
      pass_missing_as_none: true
    image: ghcr.io/landmanbester/spimple:latest
    inputs:
      images:
        info:
          Fits images providing the coordinates to interpolate to
        dtype: List[str]
        required: true
        policies:
          positional: true
      output-filename:
        info:
          Path of the output beam cube
        dtype: File
        required: true
        policies:
          positional: true
      ms:
        info:
          Measurement sets used to make the image.
          Used to get parallactic angles when doing primary beam correction.
        dtype: Optional[List[str]]
      field:
        info:
          Field ID
        dtype: int
        default: 0
      beam-model:
        info:
          Fits beam model to use.
          The expected on-disk pattern is path_to_beam/name_corr_re.fits and the matching _im.fits.
          Provide only the path up to name, for example /home/user/beams/meerkat_lband.
          Patterns matching corr are determined automatically.
          Only real and imaginary beam models are currently supported.
        dtype: Optional[File]
      sparsify-time:
        info:
          Used to select a subset of time
        dtype: int
        default: 10
      nthreads:
        info:
          Number of threads to use.
          Defaults to all available
        dtype: Optional[int]
      corr-type:
        info:
          Correlation type i.e.
          linear or circular
        choices:
        - linear
        - circular
        default: linear
    outputs:
      power-beam:
        dtype: File
        info:
          Interpolated power beam cube on the image coordinate grid.
        implicit: '{current.output-filename}'
