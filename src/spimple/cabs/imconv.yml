cabs:
  imconv:
    flavour: python
    command: spimple.core.imconv.imconv
    name: imconv
    info:
      Homogenise resolution with Gaussian convolution
    policies:
      pass_missing_as_none: true
    image: ghcr.io/landmanbester/spimple:latest
    inputs:
      images:
        info:
          Images to convolve
        dtype: List[str]
        required: true
        policies:
          positional: true
      output-filename:
        info:
          Basename of output products
        dtype: File
        required: true
        policies:
          positional: true
      products:
        info:
          Outputs to write, as a string of letters.
          c is the restoring beam used for convolution.
          i is the convolved image.
          b is the average power beam.
          w is the beam-squared weight image used for mosaicing.
        default: i
      psf-pars:
        info:
          Beam parameters matching FWHM of restoring beam specified as emaj emin pa.
          By default these are taken from the fits header
        dtype: Optional[Tuple[float, float, float]]
      nthreads:
        info:
          Number of threads to use.
          Defaults to all available
        dtype: Optional[int]
      circ-psf:
        info:
          Flag to convolve with a circularised beam instead of an elliptical one
        dtype: bool
        default: false
      dilate:
        info:
          Dilate the psf-pars in fits header by this amount.
          Sometimes required for stability.
        dtype: float
        default: 1.05
      beam-model:
        info:
          Fits beam model to use.
          Use binterp to make a power beam matching the image.
        dtype: Optional[File]
      band:
        info:
          Band to use with JimBeam.
          L, UHF or S
        default: L
      pb-min:
        info:
          Set image to zero where primary beam falls below this value
        dtype: float
        default: 0.05
      padding-frac:
        info:
          Padding fraction for FFTs (half on either side)
        dtype: float
        default: 0.5
      out-dtype:
        info:
          Data type of output.
          Default is single precision
        default: f4
    outputs:
      convolved-image:
        dtype: File
        info:
          Convolved image, written when products contains 'i'.
        implicit: '{current.output-filename}.convolved.fits'
